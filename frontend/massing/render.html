<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الرندر المعماري | أنت المهندس</title>
  <link rel="stylesheet" href="/massing/style.css">
</head>
<body data-render-page="true">
  <header><a href="/massing/">← العودة إلى الطرز</a><strong>أنت المهندس</strong></header>
  <main>
    <h1>الرندر المعماري</h1>
    <p id="status" role="status">جارٍ رفع المسقط المختار…</p>
    <div id="phase-progress" class="generation-progress" hidden>
  <div id="phase-ring" class="progress-ring" role="progressbar" aria-label="تقدم العملية" aria-valuemin="0" aria-valuemax="100"><strong id="phase-percent"></strong></div>
  <div><span id="phase-detail"></span><div id="phase-elapsed"></div></div>
</div>
    <div id="workspace" hidden>
      <section class="viewer" aria-label="عارض الكتلة">
        <canvas id="stage" tabindex="0" aria-label="الكتلة ثلاثية الأبعاد. استخدم الأسهم لتدويرها."></canvas>
        <div class="tools">
          <button type="button" id="right" aria-label="دور يمينًا">↻</button>
          <button type="button" id="left" aria-label="دور يسارًا">↺</button>
          <button type="button" id="zoom-in" aria-label="تقريب">+</button>
          <button type="button" id="zoom-out" aria-label="إبعاد">−</button>
          <button type="button" id="reset">إعادة ضبط المنظور</button>
        </div>
      </section>
      <aside>
        <h2 id="render-style">زاوية التصوير</h2>
        <div class="facades" aria-label="الواجهات المستقيمة">
          <button type="button" data-side="east">الواجهة الشرقية</button>
          <button type="button" data-side="west">الواجهة الغربية</button>
          <button type="button" data-side="north">الواجهة الشمالية</button>
          <button type="button" data-side="south">الواجهة الجنوبية</button>
        </div>
        <p id="camera-label" role="status">منظور حر</p>
        <button type="button" class="primary" id="capture">التقاط صورة من هذه الزاوية</button>
      </aside>
    </div>
    <section id="render-result" class="viewer" hidden>
      <div class="result-head">
        <p id="render-caption"></p>
        <a class="download" id="render-download" download>تحميل الصورة PNG</a>
      </div>
      <img id="render-image" alt="صورة الرندر المعماري">
    </section>
  </main>
  <script type="module" src="/massing/app.js"></script>
</body>
</html>
