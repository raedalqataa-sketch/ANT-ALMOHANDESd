plugins { id 'com.android.application' }
android {
    namespace 'com.antalmohandes.probe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.antalmohandes.probe'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1-probe'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = ["${rootDir}/../build"] } }
    androidResources { noCompress += ['wasm', 'whl', 'zip'] }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
