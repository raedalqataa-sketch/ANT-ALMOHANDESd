name: ASSL family-stack evidence
on:
  push:
    branches: [work/editor-to-massing]
    paths:
      - 'assl/**'
      - 'backend/**'
      - 'frontend/composition/**'
      - 'frontend/facades/**'
      - 'frontend/massing/**'
      - 'tests/test_clustered_family_stack.py'
      - 'tests/test_styled_massing_geometry.py'
      - 'tests/test_elevations.py'
      - 'scripts/export_facade_benchmark.py'
      - 'scripts/export_family_site_benchmark.py'
      - 'requirements.txt'
      - '.github/workflows/assl-family-stack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANT_FAMILY_EVIDENCE_DIR: family-stack-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing engine dependencies
        run: pip install -r requirements.txt
      - name: Generate and verify two-floor alternatives
        run: |
          mkdir -p family-stack-evidence
          python -m pytest -q tests/test_clustered_family_stack.py tests/test_styled_massing_geometry.py tests/test_elevations.py --junitxml=family-stack-evidence/tests.xml
      - name: Export and reopen the site benchmark DXF
        run: python -m scripts.export_family_site_benchmark family-stack-evidence ANT-Site-Benchmarks-R2010.dxf
      - name: Archive the single AutoCAD 2010 drawing
        uses: actions/upload-artifact@v4
        with:
          name: ANT-Site-Benchmarks-R2010
          path: ANT-Site-Benchmarks-R2010.dxf
          if-no-files-found: error
      - name: Verify and export the metric facade drawings
        run: python -m scripts.export_facade_benchmark family-stack-evidence ANT-Facades-R2010.dxf
      - name: Archive one AutoCAD 2010 facade drawing
        uses: actions/upload-artifact@v4
        with:
          name: ANT-Facades-R2010
          path: ANT-Facades-R2010.dxf
          if-no-files-found: error
      - name: Archive plans, massing and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-stack-evidence-${{ github.sha }}
          path: family-stack-evidence/
          if-no-files-found: error
