name: Stage 012 MILP geometry and strict 009 integration (experimental)
on:
  push:
    branches:
      - feature/architecture-relationship-milp-012-experimental
    paths:
      - 'assl/relationship_first_012.py'
      - 'assl/stage012_validation_gate.py'
      - 'tests/test_assl_relationship_first_012.py'
      - 'tests/fixtures/assl_milp_012_candidate.json'
      - 'scripts/assl_stage012_render.py'
      - '.github/workflows/architecture-milp-012.yml'
  workflow_dispatch:

jobs:
  geometry-and-real-door-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometric dependencies
        run: pip install -r requirements.txt pillow
      - name: Run honest concept geometry regressions
        run: python -m pytest -q tests/test_assl_relationship_first_012.py
      - name: Render actual stored solution without invented openings
        run: python scripts/assl_stage012_render.py
      - name: Exact stage 009 door, window and body-route validation
        run: |
          python -m assl.stage012_validation_gate \
            --candidate tests/fixtures/assl_milp_012_candidate.json \
            --fixture tests/fixtures/assl_architecture_cases.json \
            --out stage012-experimental/stage012_real_009_result.json
      - name: Archive evidence even if 009 rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage012-milp-geometry-and-009-verdict
          path: stage012-experimental/
          if-no-files-found: warn
