name: Stage 012 MILP geometry and strict 009 integration (experimental)
on:
  push:
    branches:
      - feature/architecture-relationship-milp-012-experimental
      - feature/relational-first-integration-013
    paths:
      - 'assl/relationship_first_012.py'
      - 'backend/design/relationship_catalog.py'
      - 'backend/design/functional_intelligence.py'
      - 'scripts/assl_relationship_verify_012.py'
      - 'assl/stage012_validation_gate.py'
      - 'assl/stage012_feedback_search.py'
      - 'tests/test_assl_relationship_first_012.py'
      - 'tests/test_assl_stage012_feedback.py'
      - 'tests/test_assl_stage012_gate_fail_closed.py'
      - 'tests/test_assl_stage012_gemini_bridge.py'
      - 'assl/stage012_gemini_bridge.py'
      - 'tests/test_assl_stage012_window_clearance.py'
      - 'tests/fixtures/assl_milp_012_candidate.json'
      - 'scripts/assl_stage012_render.py'
      - '.github/workflows/architecture-milp-012.yml'
  workflow_dispatch:

jobs:
  geometry-and-real-door-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometric dependencies
        run: pip install -r requirements.txt pillow
      - name: Run honest concept geometry regressions
        run: |
          mkdir -p stage012-experimental
          python -m pytest -q tests/test_assl_relationship_first_012.py tests/test_assl_stage012_feedback.py tests/test_assl_stage012_window_clearance.py tests/test_assl_stage012_gate_fail_closed.py tests/test_assl_stage012_gemini_bridge.py \
            --junitxml=stage012-experimental/pytest012.xml
      - name: Render actual stored solution without invented openings
        run: python scripts/assl_stage012_render.py
      - name: Exact stage 009 door, window and body-route validation
        run: |
          python -m assl.stage012_validation_gate \
            --candidate tests/fixtures/assl_milp_012_candidate.json \
            --fixture tests/fixtures/assl_architecture_cases.json \
            --out stage012-experimental/stage012_real_009_result.json
      - name: Bounded 012 feedback search using real 009/010 outcomes
        if: always()
        run: |
          python -m assl.stage012_feedback_search \
            --fixture tests/fixtures/assl_architecture_cases.json \
            --layouts 4 --repacks 2 --seconds 1.0 \
            --out stage012-experimental/feedback_012.json
      - name: Archive evidence even if 009 rejects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage012-milp-geometry-and-009-verdict
          path: stage012-experimental/
          if-no-files-found: warn
