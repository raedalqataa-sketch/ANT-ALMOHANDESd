name: Live site engine provenance (informational)
on:
  pull_request:
    paths:
      - 'ops/release/**'
      - 'tests/test_live_release_provenance.py'
      - '.github/workflows/live-engine-proof.yml'
  push:
    branches: [main]
    paths:
      - 'backend/design/**'
      - 'ops/release/**'
      - '.github/workflows/live-engine-proof.yml'
  workflow_dispatch:
    inputs:
      gemini_live:
        description: 'Run the isolated Gemini experiment on feature/ai-auto-keys-002 only'
        required: false
        type: boolean
        default: false
      connection_only:
        description: 'Only verify secret and models API; never run inference'
        required: false
        type: boolean
        default: true
      model:
        description: 'Optional Gemini model identifier'
        required: false
        type: string
        default: ''
      free_tier_confirmed:
        description: 'Owner confirms unbilled project and selected model free-tier eligibility'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Monitor browser engine source against current checked out commit
        id: live
        continue-on-error: true
        run: |
          python ops/release/verify_live.py --expected-commit "$GITHUB_SHA" --timeout 20 --output live-engine-proof.json
      - name: Publish transparent result
        if: always()
        shell: bash
        run: |
          if [ -f live-engine-proof.json ]; then
            python - <<'PY'
          import json,os
          p=json.load(open("live-engine-proof.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Live browser-engine provenance\n\n")
              f.write(f"**{p['status']}** vs commit \`{p['expected_git_commit']}\`\n\n")
              f.write(f"Published reachable: {p['live_site_published']}; engine identical: {p['verified_same_engine']}\n")
              f.write("\nThis is an informational pre-release monitor. The separate Live release gate must report MATCH after deployment.\n")
          PY
          else
            echo 'No live engine proof report produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-engine-source-comparison
          path: live-engine-proof.json
          if-no-files-found: warn
          retention-days: 30

  gemini-experiment:
    name: Gemini Architectural Live Test
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'feature/ai-auto-keys-002' && inputs.gemini_live }}
    uses: ./.github/workflows/gemini-live-proof.yml
    with:
      connection_only: ${{ inputs.connection_only }}
      model: ${{ inputs.model }}
      free_tier_confirmed: ${{ inputs.free_tier_confirmed }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
