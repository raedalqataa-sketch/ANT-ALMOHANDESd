name: Live site engine provenance (informational)
on:
  pull_request:
    paths:
      - 'ops/release/**'
      - 'tests/test_live_release_provenance.py'
      - '.github/workflows/live-engine-proof.yml'
  push:
    branches: [main]
    paths:
      - 'backend/design/**'
      - 'ops/release/**'
      - '.github/workflows/live-engine-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Monitor browser engine source against current checked out commit
        id: live
        continue-on-error: true
        run: |
          python ops/release/verify_live.py --expected-commit "$GITHUB_SHA" --timeout 20 --output live-engine-proof.json
      - name: Publish transparent result
        if: always()
        shell: bash
        run: |
          if [ -f live-engine-proof.json ]; then
            python - <<'PY'
          import json,os
          p=json.load(open("live-engine-proof.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Live browser-engine provenance\n\n")
              f.write(f"**{p['status']}** vs commit \`{p['expected_git_commit']}\`\n\n")
              f.write(f"Published reachable: {p['live_site_published']}; engine identical: {p['verified_same_engine']}\n")
              f.write("\nThis is an informational pre-release monitor. The separate Live release gate must report MATCH after deployment.\n")
          PY
          else
            echo 'No live engine proof report produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-engine-source-comparison
          path: live-engine-proof.json
          if-no-files-found: warn
          retention-days: 30
