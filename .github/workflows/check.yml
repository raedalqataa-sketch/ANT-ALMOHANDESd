name: Check architectural drafts
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - if: always()
        run: node --check frontend/app.js
      - if: always()
        run: node --check frontend/studio.js
      - if: always()
        run: node --check web_generator/app.js
      - if: always()
        run: node --check lovable_integration/automatic-runtime.js
      - if: always()
        run: node --test tests/lovable_bridge.test.cjs tests/worker_session.test.cjs tests/request_path.test.cjs tests/telemetry.test.cjs
      - if: always()
        run: npm ci --prefix client_web --ignore-scripts --no-audit --no-fund
      - if: always()
        run: node --test tests/plot-intake.test.cjs tests/locations.test.cjs
      - if: always()
        run: npm run build --prefix client_web
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Python 3.11 production runtime
        run: docker build -t ant-almohandes:ci .
      - name: Confirm runtime engineering modules import
        run: |
          docker run --rm --entrypoint python ant-almohandes:ci -c "import ortools, shapely, networkx, cv2, pypdf, pypdfium2, ezdxf; print('Engineering imports OK')"
