name: Check architectural drafts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - if: always()
        run: node --check frontend/app.js
      - if: always()
        run: node --check frontend/studio.js
      - if: always()
        run: node --check web_generator/app.js
      - if: always()
        run: node --check lovable_integration/automatic-runtime.js
      - if: always()
        run: node --test tests/lovable_bridge.test.cjs tests/worker_session.test.cjs
      - if: always()
        run: npm ci --prefix client_web --ignore-scripts --no-audit --no-fund
      - if: always()
        run: node --test tests/plot-intake.test.cjs tests/locations.test.cjs
      - if: always()
        run: npm run build --prefix client_web
