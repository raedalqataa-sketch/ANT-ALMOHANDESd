name: Experimental architectural proof 009 and 010
on:
  workflow_dispatch:
    inputs:
      proof_ref:
        description: Exact experimental commit or branch to verify
        required: true
        default: feature/architecture-door-circulation-validation-009
      stage:
        description: '009 or 010'
        required: true
        default: '009'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.proof_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Actual geometry proof
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          if [ "$STAGE" = "009" ]; then
            python scripts/assl_openings_benchmark.py evidence
          elif [ "$STAGE" = "010" ]; then
            python scripts/assl_replan_benchmark.py evidence
          else
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-architecture-proof
          path: evidence/
