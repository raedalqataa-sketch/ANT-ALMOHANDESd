name: Integrated V2.1 geometry trial
on:
  push:
    branches: [preview/client-engine-v2]
    paths: ['.github/workflows/v21-integrated.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial:
    if: github.ref == 'refs/heads/preview/client-engine-v2' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt matplotlib ezdxf
      - run: python -m pytest -q tests/test_rules_v21_floor_assignment.py
      - run: |
          mkdir -p integrated-results
          python - <<'PY'
          import json
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          from matplotlib.patches import Rectangle
          import ezdxf
          from pathlib import Path
          from backend.design.rules_v21_pipeline import run
          from backend.design.rules_v21_mass_geometry import mass_union
          assert mass_union([[0,0,4,4],[2,0,4,4]])["union_area_m2"]==24
          rows=[]
          for key,zone,area in [('majlis','guest',24),('living','family',24),('kitchen','service',16),('bedroom','private',18)]:
              rows.append(dict(id=key,type=key,count=1,required=True,allowed_floors=['ground'],privacy_zone=zone,area_min_m2=area,area_target_m2=area,area_max_m2=area*1.5,min_side_mm=2500,adjacency_required=[],adjacency_forbidden=[]))
          result=run(dict(program=rows,floors=['ground']),{'ground':[0,0,16,12]},{'ground':150})
          Path('integrated-results/report.json').write_text(json.dumps(result,indent=2))
          layouts=result.get('floors',{}).get('ground',{}).get('layouts',[])
          for i,layout in enumerate(layouts):
              parts=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16000 12000">']
              for room in layout['rooms']:
                  x,y,w,h=room['rect_mm']
                  parts.append(f'<rect x="{x}" y="{y}" width="{w}" height="{h}" fill="white" stroke="black" stroke-width="50"/><text x="{x+w/2}" y="{y+h/2}" font-size="250" text-anchor="middle">{room["id"]}</text>')
              parts.append('</svg>')
              Path(f'integrated-results/layout-{i}.svg').write_text(''.join(parts))
              fig,ax=plt.subplots(figsize=(12,9))
              doc=ezdxf.new('R2010'); doc.units=4
              m=doc.modelspace()
              for room in layout['rooms']:
                  x,y,w,h=room['rect_mm']
                  ax.add_patch(Rectangle((x,y),w,h,facecolor='white',edgecolor='black',linewidth=2))
                  ax.text(x+w/2,y+h/2,room['id'],ha='center',va='center',fontsize=8)
                  m.add_lwpolyline([(x,-y),(x+w,-y),(x+w,-y-h),(x,-y-h)],close=True)
                  m.add_text(room['id'],dxfattribs={'height':180,'insert':(x+100,-y-h/2)})
              ax.autoscale_view(); ax.set_aspect('equal'); ax.invert_yaxis(); ax.axis('off')
              ax.set_title('Experimental geometry - not approved')
              fig.savefig(f'integrated-results/layout-{i}.png',dpi=220,bbox_inches='tight'); plt.close(fig)
              filename=f'integrated-results/layout-{i}.dxf'
              doc.saveas(filename)
              assert len(ezdxf.readfile(filename).modelspace())==2*len(layout['rooms'])
          assert layouts, 'No integrated geometry; inspect report'
          assert not result['accepted']
          assert any(not l['access']['unreachable'] for l in layouts), 'No connected circulation candidate'
          print('Geometry candidates:',len(layouts),'Accepted:',sum(l['accepted'] for l in layouts))
          print('At least one candidate has internal access; exterior entry remains unverified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-v21-results
          path: integrated-results/
          retention-days: 1
