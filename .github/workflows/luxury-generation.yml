name: Luxury architectural generation
on:
  push:
    branches: [feature/replit-continuation]
    paths: ['.github/workflows/luxury-generation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: luxury-generation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/feature/replit-continuation' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Generate and assess luxury villa
        run: |
          python -u - <<'PY'
          import json
          from pathlib import Path
          from backend.design.architect_planner import ClientIntent, propose
          from backend.design.general_engine import generate_general
          from backend.design.design_selection import evaluate
          from backend.design.constitution_v2 import assess_candidate
          out = Path('luxury-run')
          out.mkdir(exist_ok=True)
          i = ClientIntent(width=32, depth=40, family=8, city='Riyadh', street_edges=['bottom'], street_widths={'bottom':15}, output_level='luxury', floors='two', design_priority='prestige')
          b, _ = propose(i)
          r = generate_general(b, out/'drawings', candidate_families=('cluster',), search_options=[dict(family='cluster',policy='relationship_aware',core_position='rear')], emit_drawings=True, architecture_first=True)
          for m in r['candidates']:
              m['design_evaluation'] = evaluate(m,i)
              m['constitution_v2'] = assess_candidate(m)
          (out/'results.json').write_text(json.dumps(r,ensure_ascii=False,default=str))
          if not r['candidates']:
              raise RuntimeError('No candidates generated')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luxury-generation-results
          path: luxury-run/
          retention-days: 1
          if-no-files-found: warn
