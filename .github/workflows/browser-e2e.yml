name: Browser smoke tests
on:
  push:
    paths:
      - 'client_web/**'
      - '.github/workflows/browser-e2e.yml'
  pull_request:
    paths:
      - 'client_web/**'
      - '.github/workflows/browser-e2e.yml'
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client_web/package-lock.json
      - run: npm ci --prefix client_web --no-audit --no-fund
      - run: npm run build --prefix client_web
      - run: npx --prefix client_web playwright install --with-deps chromium
      - run: npm run test:e2e --prefix client_web
